<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="https://media.base44.com/images/public/6a75c91fa5dfe02359c5f127/7971fd204_HiKidsLogo.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- No manifest.json: the site has no locally-hosted, correctly-sized
         icon asset to reference honestly (the logo/favicon are both
         cross-origin CDN URLs, not same-origin 192x192/512x512 PNGs a real
         PWA manifest needs) — removed the reference rather than invent one.
         Revisit once real local icon assets exist. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <!-- Description matches the store's actual current capability — card
         payment is toggled off store-wide right now (see the trust-strip
         batch's finding), so this no longer claims "pay by card". Title and
         description are bilingual (Latin + Arabic brand name, Palestine) so
         Arabic searches can match this static shell; the og:/twitter: tags
         below repeat the same strings. -->
    <meta name="description" content="HiKids (هاي كيدز) – curated premium toys for kids in Palestine. Order online, cash on delivery. متجر ألعاب أطفال في فلسطين – الدفع عند الاستلام." />
    <title>HiKids | هاي كيدز – ألعاب أطفال في فلسطين</title>

    <!-- Homepage/default social + search metadata, hardcoded to the production
         origin (www is primary; the apex redirects to it). Not Vite's %ENV%
         HTML replacement: it leaves the literal token in the output when the
         var is unset at build time, which would be a worse broken canonical.
         Everything else reads VITE_SITE_URL (src/lib/siteUrl.js, middleware,
         api/), so keep that set to the same origin in Vercel. This is also
         what a non-JS crawler (Facebook/WhatsApp/etc.) sees for every route
         OTHER than /product/:id, which has its own dynamic snapshot from
         middleware.js — an honest, disclosed limitation for
         Shop/Bundles/FAQ/etc. rather than a per-page dynamic solution. -->
    <link rel="canonical" href="https://www.hikids-ps.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HiKids" />
    <meta property="og:title" content="HiKids | هاي كيدز – ألعاب أطفال في فلسطين" />
    <meta property="og:description" content="HiKids (هاي كيدز) – curated premium toys for kids in Palestine. Order online, cash on delivery. متجر ألعاب أطفال في فلسطين – الدفع عند الاستلام." />
    <meta property="og:image" content="https://media.base44.com/images/public/6a75c91fa5dfe02359c5f127/7971fd204_HiKidsLogo.webp" />
    <meta property="og:url" content="https://www.hikids-ps.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HiKids | هاي كيدز – ألعاب أطفال في فلسطين" />
    <meta name="twitter:description" content="HiKids (هاي كيدز) – curated premium toys for kids in Palestine. Order online, cash on delivery. متجر ألعاب أطفال في فلسطين – الدفع عند الاستلام." />
    <meta name="twitter:image" content="https://media.base44.com/images/public/6a75c91fa5dfe02359c5f127/7971fd204_HiKidsLogo.webp" />
    <meta name="robots" content="index, follow" />

    <!-- Brand entity for search engines: name (Latin + Arabic), logo and the
         social profiles that identify this store. Static like the tags above
         (JS-injected markup is read later and less reliably); keep sameAs in
         step with the social links saved in admin site settings. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "HiKids",
        "alternateName": "هاي كيدز",
        "url": "https://www.hikids-ps.com/",
        "logo": "https://media.base44.com/images/public/6a75c91fa5dfe02359c5f127/7971fd204_HiKidsLogo.webp",
        "sameAs": ["https://www.instagram.com/hi_kids.ps/"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
